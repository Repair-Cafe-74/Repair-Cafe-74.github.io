local_backend: true

backend:
  name: github
  repo: Repair-Cafe-74/Repair-Cafe-74.github.io
  branch: main
  site_domain: repair-cafe-74.github.io
  base_url: https://repair-cafe-74.netlify.app
  auth_endpoint: auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "events"
    label: "Événements"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Lieu", name: "location", widget: "string" }
      - { label: "Résumé", name: "summary", widget: "text" }
      - { label: "Contenu", name: "body", widget: "markdown", required: false }

  - name: "permanences"
    label: "Permanences ponctuelles"
    folder: "src/content/permanences"
    create: true
    identifier_field: "date"
    summary: "{{date | date('YYYY-MM-DD')}} — {{repairCafe}} — {{location}} — {{title}}"
    slug: "{{slug}}"
    fields:
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Repair Café"
        name: "repairCafe"
        widget: "relation"
        collection: "locations"
        search_fields: ["name"]
        value_field: "{{slug}}.md"
        display_fields: ["name"]
        required: false
        hint: "Si renseigné, le nom et l'adresse du Repair Café sont repris automatiquement."
      - { label: "Titre", name: "title", widget: "string", required: false, hint: "Obligatoire si aucun Repair Café n'est sélectionné." }
      - { label: "Lieu", name: "location", widget: "string", required: false, hint: "Obligatoire si aucun Repair Café n'est sélectionné." }
      - { label: "Résumé", name: "summary", widget: "text", required: false }
      - { label: "Contenu", name: "body", widget: "markdown", required: false }

  - name: "faq"
    label: "FAQ"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Ordre", name: "order", widget: "number", default: 0 }
      - { label: "Réponse", name: "body", widget: "markdown" }

  - name: "locations"
    label: "Lieux"
    folder: "src/content/locations"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom", name: "name", widget: "string" }
      - { label: "Latitude", name: "lat", widget: "number", value_type: "float" }
      - { label: "Longitude", name: "lng", widget: "number", value_type: "float" }
      - { label: "Adresse", name: "address", widget: "string" }
      - { label: "Horaires", name: "hours", widget: "string" }
      - { label: "Lien", name: "link", widget: "string", required: false }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "resources"
    label: "Ressources"
    folder: "src/content/resources"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Fichier", name: "file", widget: "file", media_folder: "/public/documents", public_folder: "/documents" }
      - { label: "Type", name: "type", widget: "string", default: "PDF" }
      - { label: "Ordre", name: "order", widget: "number", default: 0 }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "photos"
    label: "Photos"
    folder: "src/content/photos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image", media_folder: "/public/images/uploads", public_folder: "/images/uploads" }
      - { label: "Texte alternatif", name: "alt", widget: "string" }
      - { label: "Légende", name: "caption", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Mise en avant", name: "featured", widget: "boolean", default: false }

  - name: "press"
    label: "Presse et liens"
    folder: "src/content/press"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "URL", name: "url", widget: "string", required: false }
      - { label: "Source", name: "source", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Contenu", name: "body", widget: "markdown", required: false }

  - name: "news"
    label: "Actualités"
    folder: "src/content/news"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Résumé", name: "summary", widget: "text" }
      - { label: "Auteur", name: "author", widget: "string" }
      - { label: "Contenu", name: "body", widget: "markdown" }
