local_backend: true

backend:
  name: github
  repo: Repair-Cafe-74/Repair-Cafe-74.github.io
  branch: main
  site_domain: repair-cafe-74.netlify.app
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "events"
    label: "Evenements"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Lieu", name: "location", widget: "string" }
      - { label: "Resume", name: "summary", widget: "text" }
      - { label: "Contenu", name: "body", widget: "markdown" }

  - name: "faq"
    label: "FAQ"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Ordre", name: "order", widget: "number", default: 0 }
      - { label: "Reponse", name: "body", widget: "markdown" }

  - name: "locations"
    label: "Lieux"
    folder: "src/content/locations"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom", name: "name", widget: "string" }
      - { label: "Latitude", name: "lat", widget: "number", value_type: "float" }
      - { label: "Longitude", name: "lng", widget: "number", value_type: "float" }
      - { label: "Adresse", name: "address", widget: "string" }
      - { label: "Horaires", name: "hours", widget: "string" }
      - { label: "Lien", name: "link", widget: "string", required: false }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "resources"
    label: "Ressources"
    folder: "src/content/resources"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Fichier", name: "file", widget: "file", media_folder: "/public/documents", public_folder: "/documents" }
      - { label: "Type", name: "type", widget: "string", default: "PDF" }
      - { label: "Ordre", name: "order", widget: "number", default: 0 }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "photos"
    label: "Photos"
    folder: "src/content/photos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image", media_folder: "/public/images/uploads", public_folder: "/images/uploads" }
      - { label: "Texte alternatif", name: "alt", widget: "string" }
      - { label: "Legende", name: "caption", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Mise en avant", name: "featured", widget: "boolean", default: false }

  - name: "press"
    label: "Presse et liens"
    folder: "src/content/press"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "URL", name: "url", widget: "string" }
      - { label: "Source", name: "source", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
